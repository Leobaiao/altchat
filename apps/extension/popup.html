<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AltChat Zero-Code</title>
  <style>
    body { width: 300px; padding: 15px; font-family: system-ui, sans-serif; }
    label { display: block; margin-top: 10px; font-size: 12px; font-weight: bold; }
    input { width: 100%; padding: 5px; margin-top: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 8px; margin-top: 15px; background: #2563eb; color: white; border: none; cursor: pointer; border-radius: 4px; }
    button:hover { background: #1d4ed8; }
    .status { margin-top: 10px; font-size: 12px; color: green; text-align: center; }
  </style>
</head>
<body>
  <h2>AltChat Injector</h2>
  <label>Tenant ID:</label>
  <input type="text" id="tenantId" placeholder="ex: tenant_abc123">
  
  <label>Client ID:</label>
  <input type="text" id="clientId" placeholder="ex: client_default">
  
  <label>API Key:</label>
  <input type="password" id="apiKey" placeholder="Sua API Key">
  
  <label>Endpoint (Opcional):</label>
  <input type="text" id="endpoint" value="http://localhost:4300">

  <button id="saveBtn">Salvar e Injetar na Aba Atual</button>
  <div class="status" id="statusMsg"></div>

  <script src="popup.js"></script>
</body>
</html>
